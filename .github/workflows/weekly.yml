name: Weekly Health Content Update

on:
  schedule:
    # يعمل تلقائياً كل يوم جمعة الساعة 12 ظهراً
    - cron: '0 12 * * 5'
  workflow_dispatch: # يتيح لك تشغيله يدوياً لتجربته في أي وقت

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # إعطاء صلاحية الكتابة للملفات
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run update script
        run: python update_content.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/weekly.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly health content" && git push)
